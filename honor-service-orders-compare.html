<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>荣誉服务订单｜中英文对照</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#506076;background:#edf1f6}
*{box-sizing:border-box}body{margin:0}.top{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap;background:#fff;border-bottom:1px solid #dfe7f0;padding:15px 22px}
h1{font-size:17px;font-weight:650;color:#34455d;margin:0}.subtitle{font-size:12px;color:#8191a4;margin-top:5px}
.actions{display:flex;gap:8px;align-items:center}.top a{font-size:12px;color:#257ac9;text-decoration:none;padding:7px 11px;border:1px solid #ccddf1;border-radius:5px;background:#f5f9ff}.top a:hover{background:#e6f2ff}
.panels{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;padding:12px;height:calc(100vh - 79px);min-height:440px}
.pane{min-width:0;display:flex;flex-direction:column;background:white;border:1px solid #dce5ef;border-radius:6px;overflow:hidden}
.pane header{display:flex;justify-content:space-between;align-items:center;padding:10px 15px;background:#f8fbff;border-bottom:1px solid #e3ebf4;font-size:13px;font-weight:650;color:#40536d}
.pane header a{font-size:12px;font-weight:400;color:#2884dd;text-decoration:none}
iframe{border:0;width:100%;flex:1;background:#fff}
.toggle{display:none}
@media(max-width:960px){
 .top{padding:12px}.panels{height:calc(100dvh - 112px);padding:8px;display:block;min-height:430px}
 .pane{height:100%;display:none}.pane.active{display:flex}.toggle{display:flex;gap:8px;padding:8px;background:#fff}
 .toggle button{flex:1;padding:9px 6px;background:#fff;color:#6b7c91;border:1px solid #dae4f0;border-radius:5px;font:inherit;cursor:pointer}
 .toggle button.active{background:#eaf4ff;color:#2078ca;border-color:#91c5f5}
}
</style></head>
<body><div class="top"><div><h1>荣誉服务订单 · 中英文对照</h1><div class="subtitle">两版功能一致，数据各自独立保存</div></div>
<div class="actions"><a href="./honor-service-orders-zh.html" target="_blank" rel="noopener">单独查看中文版 ↗</a><a href="./honor-service-orders.html" target="_blank" rel="noopener">Open English ↗</a></div></div>
<nav class="toggle" aria-label="切换对照语言"><button class="active" data-target="zh" type="button">中文版</button><button data-target="en" type="button">English</button></nav>
<main class="panels"><section class="pane active" data-pane="zh"><header><span>中文版 · Chinese</span><a href="./honor-service-orders-zh.html" target="_blank" rel="noopener">新窗口查看 ↗</a></header><iframe src="./honor-service-orders-zh.html" title="荣誉服务订单中文版本" loading="eager"></iframe></section>
<section class="pane" data-pane="en"><header><span>English · 英文版</span><a href="./honor-service-orders.html" target="_blank" rel="noopener">Open in new tab ↗</a></header><iframe src="./honor-service-orders.html" title="Honor service orders English version" loading="eager"></iframe></section></main>
<script>
document.querySelectorAll("[data-target]").forEach(button=>button.addEventListener("click",()=>{
 const active=button.dataset.target;
 document.querySelectorAll("[data-target]").forEach(b=>b.classList.toggle("active",b.dataset.target===active));
 document.querySelectorAll("[data-pane]").forEach(p=>p.classList.toggle("active",p.dataset.pane===active));
}));
</script></body></html>
