function toUTCms(country,local){if(!country||!local)return NaN;let tz=(COUNTRY.find(x=>x.name===country)||COUNTRY[0]).zone;let m=String(local).match(/^(\d{4})-(\d\d)-(\d\d)T(\d\d):(\d\d)/);if(!m)return NaN;let desired=Date.UTC(+m[1],+m[2]-1,+m[3],+m[4],+m[5]);let guess=desired;for(let i=0;i<5;i++){let o=tzParts(guess,tz);let wall=Date.UTC(o.year,o.month-1,o.day,o.hour,o.minute,o.second);let next=guess+desired-wall;if(next===guess)break;guess=next}return guess}

function initConfig(){if(!db.config)db.config={banner:'Banner & Splash Design Group',overseas:'Overseas Assistant Cooperation Group',gift:'Customized gift progress communication',ride:'Customized ride progress communication',designer:'@UI Designer'};return db.config}
initConfig();function addLog(title,msg,group='',notify=false){db.logs.unshift({id:Date.now()+Math.floor(Math.random()*1000),date:nowString(),title,group,notify,text:msg});if(db.logs.length>100)db.logs=db.logs.slice(0,100)}
function notificationPlan(l,before,after,isNew,meta={}){const config=initConfig();if(l==='orders'){if(after.details.kind==='unlock')return null;if(after.details.kind==='banner'){if(after.details.mode!=='design')return null;let keys=['color','copy','sourceImage_name','referenceImage_name','localStart','localEnd','countries','designer'];if(!isNew&&!equalShallowNotify(before.details,after.details,keys))return null;return {group:config.banner,title:'Banner & Splash 设计',text:`用户ID：${after.uid}\n用户名：${after.name}\n用户国家：${after.country}\n订单时间：${after.created}\n权益：${after.benefit}\n颜色：${after.details.color||'—'}\n文案：${after.details.copy||'—'}\n开始结束时间：${after.details.localStart||'—'} ～ ${after.details.localEnd||'—'}\n展示国家：${(after.details.countries||[]).join('、')||'—'}\n设计师：${after.details.designer||config.designer}\n素材/参考图：${after.details.sourceImage_name||'—'} / ${after.details.referenceImage_name||'—'}`}}let type=after.details.kind;return {group:config[type],title:type==='gift'?'定制礼物设计':'定制座驾设计',text:`用户ID：${after.uid}\n用户名：${after.name}\n用户国家：${after.country}\n订单时间：${after.created}\n${type==='gift'?'礼物名称':'座驾名称'}：${after.details.title||'—'}\n${type==='gift'?'价格：'+(after.details.giftPrice||'—')+'\n有效时长：'+(after.details.validity||'—')+'\n描述：'+(after.details.description||'—'):'主题：'+(after.details.theme||'—')}\n设计师：${after.details.designer||config.designer}`}}
if(l==='overseas'){if(after.mode==='config')return null;return {group:config.overseas,title:'海外员工录入服务信息（banner/splash）-'+(after.mode==='design'?'需设计':'成品图'),text:`需求ID：${after.id}\n荣誉权益：${(after.types||[]).join('、')}\n代理ID：${after.agent||'—'}\n上线国家：${(after.countries||[]).join('、')}\n当地上线时间：${after.localStart||'—'}\nUTC+8：${(after.countries||[]).map(c=>c+': '+toBeijing(c,after.localStart)).join('；')}\n图片：${[after.bannerImage_name,after.splashImage_name].filter(Boolean).join(' / ')||'—'}${after.mode==='design'?'\n文案：'+(after.copy||'—')+'\nUI设计师：'+(after.designer||config.designer):''}`}}
if(l==='regional'){if(!isNew && before?.requested)return null;let type=after.kind;return {group:config[type],title:type==='ride'?'定制座驾设计':'定制礼物设计',text:`需求ID：${after.id}\n用户ID：${after.uid||'—'}\n用户名：${after.name||'—'}\n用户国家：${after.country||'—'}\n订单时间：${after.updated}\n购买渠道：${after.channel||'poppo'}\n${type==='ride'?'座驾名称':'礼物名称'}：${after.title||'—'}\n设计师：${after.designer||config.designer}`}}
return null}
function validateModal(){let l=editing.lane;const v=formState;if(l==='overseas'){if(!v.types?.length){n('请至少选择一项荣誉权益类型',true);return false}if(!v.agent?.trim()){n('请填写代理ID',true);return false}if(!v.countries?.length){n('请至少选择一个上线国家',true);return false}if(!v.localStart){n('请选择当地上线时间',true);return false}}if(l==='regional'){if(!v.uid?.trim()||!v.name?.trim()){n('请输入用户ID、用户名称',true);return false}if(!v.title?.trim()){n('请输入定制名称',true);return false}if(!v.country){n('请选择用户国家',true);return false}if(v.kind==='gift'&&!v.countries?.length){n('请选择礼物上线国家',true);return false}}return true}
function nextID(l){return Math.max(0,...db[l].map(r=>Number(r.id)||0))+1}
$('modalSave').onclick=()=>{if(!editing)return;gather();if(!validateModal())return;let l=editing.lane,old=editing.row?clone(editing.row):null;let v=clone(formState),isNew=editing.isNew,newRow;if(l==='orders'){newRow={...editing.row,details:v,owner:'Luna',updated:nowString()};if(v.kind==='unlock'&&v.unlockStatus==='已解封'){newRow.orderStatus='已处理';newRow.follow='已完成';newRow.completed=nowString()}}else{newRow={...(editing.row||{}),...v,id:isNew?nextID(l):editing.id,operator:'Luna',updated:nowString(),follow:editing.row?.follow||'通过WhatsApp沟通中',requested:l==='regional'?true:undefined};if(isNew)newRow.created=nowString();if(l==='overseas'&&v.mode==='design')newRow.follow='UI设计跟进中';if(l==='overseas'){newRow.processStatus=editing.row?.processStatus||'待处理';if(!newRow.follow)newRow.follow='待处理';}}
let plan=notificationPlan(l,old,newRow,isNew);if(isNew)db[l].unshift(newRow);else{let i=db[l].findIndex(r=>String(r.id)===String(editing.id));db[l][i]=newRow}addLog(`${isNew?'新增':'更新'}${l==='orders'?'用户兑换订单':l==='overseas'?'海外录入需求':'区域定制需求'} #${newRow.id}`,`操作人：Luna\n记录：${JSON.stringify({类型:newRow.benefit||newRow.kind||newRow.mode,国家:newRow.country||newRow.countries,代理ID:newRow.agent,设计要求:newRow.title||newRow.details?.title||newRow.copy||''},null,2)}`,'',false);if(plan)addLog(`模拟 Lark 推送 · ${plan.title}`,plan.text,plan.group,true);store();closeModal();filter={};page=1;render();n('保存成功'+(plan?'，已生成模拟 Lark 通知':'（本次无需通知）'))}
$('createBtn').onclick=()=>openEditor(lane,null,false);
$('tableHost').addEventListener('click',e=>{let a=e.target.closest('[data-op]');if(!a)return;let l=a.dataset.lane,id=a.dataset.id,op=a.dataset.op,arr=db[l],row=arr.find(r=>String(r.id)===id);if(!row)return;if(op==='edit'||op==='view'){openEditor(l,id,op==='view');return}if(op==='delete'){if(!confirm('确定删除需求 #'+id+'？此操作仅影响当前浏览器的演示数据。'))return;db[l]=arr.filter(r=>String(r.id)!==id);addLog(`删除需求 #${id}`,'操作人：Luna','',false);store();render();n('删除成功');return}if(op==='complete'){row.follow='已完成';if(l==='overseas')row.processStatus='已处理';row.updated=nowString();if(l==='orders'){row.orderStatus='已处理';row.completed=nowString()}addLog((l==='orders'?'录入完成用户订单 #':'完成海外需求 #')+id,'处理状态：已完成','',false);store();render();n('已标记完成');return}if(op==='returned'){if(!confirm('确定将订单 #'+id+' 标记为已退回吗？'))return;row.orderStatus='已退回';row.follow='退回（超时）';row.updated=nowString();addLog('退回用户订单 #'+id,'操作人：Luna；订单状态：已退回','',false);store();render();n('已标记退回')}});
$('tableHost').addEventListener('change',e=>{let s=e.target.closest('[data-status]');if(!s)return;let arr=db[s.dataset.status],row=arr.find(r=>String(r.id)===s.dataset.id);if(!row)return;row.follow=s.value;row.updated=nowString();if(s.value==='已完成'&&s.dataset.status==='orders'){row.orderStatus='已处理';row.completed=nowString()}addLog('跟进处理状态变更 #'+row.id,'修改为：'+s.value,'',false);store();render();n('跟进状态已更新')});
$('exportBtn').onclick=()=>{let arr=getData(),head=lane==='orders'?['订单ID','权益名称','用户ID','用户名','用户国家','订单状态','跟进状态','订单时间']:lane==='overseas'?['需求ID','代理ID','权益类型','上线国家','当地上线时间','UTC+8','处理状态','配置链接']:['需求ID','购买权益','购买渠道','用户ID','用户名','定制名称','跟进状态'];let rows=arr.map(r=>lane==='orders'?[r.id,r.benefit,r.uid,r.name,r.country,r.orderStatus,r.follow,r.created]:lane==='overseas'?[r.id,r.agent,(r.types||[]).join('/'),(r.countries||[]).join('/'),r.localStart,(r.countries||[]).map(c=>toBeijing(c,r.localStart)).join('/'),r.follow,r.configuration]:[r.id,r.kind==='gift'?'定制礼物':'定制座驾',r.channel,r.uid,r.name,r.title,r.follow]);let csv='\ufeff'+[head,...rows].map(row=>row.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(',')).join('\r\n');let blob=new Blob([csv],{type:'text/csv;charset=utf-8'});let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=`荣誉订单_${lane}_demo.csv`;a.click();URL.revokeObjectURL(u);n('已导出当前查询结果（CSV）')};
$('importBtn').onclick=()=>{let modal=$('modalBody'),old=editing;editing={lane:'import',readonly:false};$('modalTitle').textContent='导入表格批量退回';$('dialogBox').classList.add('narrow');$('modalSave').style.display='';$('modalSave').textContent='确认退回';modal.innerHTML='<div class="form-note">仅原型功能：上传包含订单ID列的 CSV/TXT 文件，将匹配的演示订单标记为「已退回」。不会连接真实订单或执行真实退回。</div><div class="frow"><label class="flabel">选择文件</label><div class="fcontrol"><input type="file" accept=".csv,.txt" id="returnImport" style="width:100%;margin-top:6px"></div></div><div class="frow"><label class="flabel">手动输入订单ID</label><div class="fcontrol"><textarea id="returnIds" placeholder="例如：1026437,1024259（一行一个或逗号分隔）"></textarea></div></div>';$('modalOverlay').classList.add('open');editing.importParent=old};
const standardSave=$('modalSave').onclick;$('modalSave').onclick=async()=>{if(editing?.lane!=='import')return standardSave();let ids=($('returnIds')?.value||'').split(/[,;\s]+/).filter(Boolean);let f=$('returnImport')?.files?.[0];if(f){let t=await f.text();ids.push(...(t.match(/\d{5,}/g)||[]))}let match=0;db.orders.forEach(r=>{if(ids.includes(String(r.id))){r.orderStatus='已退回';r.follow='退回（超时）';r.updated=nowString();match++}});if(!match){n('未找到匹配的演示订单 ID',true);return}addLog('批量退回演示订单',`匹配订单数：${match}\n订单ID：${ids.join(',')}`);store();closeModal();$('modalSave').textContent='确定';render();n('已退回 '+match+' 笔演示订单')};
function closeLogs(){$('logMount').innerHTML=''}
$('logsOpen').onclick=()=>openLogs();
function openLogs(){let settings=initConfig();$('logMount').innerHTML=`<div class="logs-float"><div class="logs-head"><span>消息模拟 / 操作记录</span><button class="close" id="closeLogs">×</button></div><div class="logs-body"><div class="form-note">此页面不接入真实 Lark。蓝色标记为“模拟通知”，普通记录为后台操作日志。可在下方修改各业务类型默认群名；修改仅保存在本地浏览器。</div><details><summary style="cursor:pointer;font-weight:bold;margin:12px 0">通知配置（模拟）</summary><div style="padding:10px 0">${[['overseas','海外录入推送群'],['banner','Banner/Splash 设计群'],['gift','定制礼物群'],['ride','定制座驾群'],['designer','默认 @设计师']].map(([k,t])=>`<div class="frow"><label class="flabel">${t}</label><div class="fcontrol"><input style="width:100%" data-config="${k}" value="${h(settings[k])}"></div></div>`).join('')}<div style="text-align:right"><button class="btn blue sm" id="saveLogSettings">保存模拟配置</button></div></div></details><div style="display:flex;align-items:center;justify-content:space-between;margin:16px 0 12px"><b>最近记录 (${db.logs.length})</b><button class="btn sm" id="clearLog">清空记录</button></div>${db.logs.map(log=>`<div class="log-item"><header><b>${log.notify?'<span class="badge">模拟通知</span> ':''}${h(log.title)}</b><span class="mute">${h(log.date)}</span></header>${log.group?`<div style="color:#438edb">群：${h(log.group)}</div>`:''}<pre>${h(log.text)}</pre></div>`).join('')||'<div class="empty">暂无记录；保存一条需求可查看模拟消息</div>'}</div></div>`;$('closeLogs').onclick=closeLogs;$('clearLog').onclick=()=>{if(confirm('清空所有本地模拟通知和操作记录？')){db.logs=[];store();openLogs()}};$('saveLogSettings')?.addEventListener('click',()=>{$all('[data-config]',$('logMount')).forEach(e=>settings[e.dataset.config]=e.value);store();n('本地模拟通知配置已保存');openLogs()})}
filter={status:'待处理'};render();
})();
</script>
